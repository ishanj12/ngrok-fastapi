[project]
name = "ngrok-fastapi"
version = "0.1.0"
description = "Bring ngrok Traffic Policy, pooling, and binding config to FastAPI, via its own lifespan hook."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "ngrok>=1.4.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
